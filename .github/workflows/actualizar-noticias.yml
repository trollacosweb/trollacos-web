name: Actualizar noticias y publicar

on:
  schedule:
    # Dos veces al dia: 07:00 y 19:00 hora de Madrid (05:00 y 17:00 UTC en horario de verano)
    - cron: "0 5,17 * * *"
  push:
    branches: [main]     # cuando cambiamos algo de la web, se publica al momento
  workflow_dispatch: {}  # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer las noticias y regenerar la web
        run: python scripts/actualizar_noticias.py

      - name: Guardar las noticias en GitHub
        run: |
          git config user.name "Trollacos Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rss.xml
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias actualizadas [skip netlify]"
            git pull --rebase origin main
            git push
          fi

      - name: Subir la web al hosting de DonDominio (FTP seguro)
        id: ftp1
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            fuentes.json
            LEEME.md
            api/datos/**
            **/node_modules/**

      - name: Esperar un minuto antes de reintentar
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        run: sleep 60

      - name: Subir la web al hosting de DonDominio (segundo intento si el primero falla)
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            fuentes.json
            LEEME.md
            api/datos/**
            **/node_modules/**

      - name: Avisar a los buscadores (IndexNow - Bing, Yandex...)
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"trollacos.com","key":"02219449dd6d548a6e7b643f1c17a331","keyLocation":"https://trollacos.com/02219449dd6d548a6e7b643f1c17a331.txt","urlList":["https://trollacos.com/","https://trollacos.com/gta-6/","https://trollacos.com/gta-6/musica/","https://trollacos.com/arcade/","https://trollacos.com/misterio/"]}'

      - name: Comprobar el marcador del arcade
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: echo "::notice::Marcador -> $(curl -s -m 20 'https://trollacos.com/api/marcadores.php?accion=lista' | head -c 300)"
