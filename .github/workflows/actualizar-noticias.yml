name: Actualizar noticias

on:
  schedule:
    # Dos veces al dia: 07:00 y 19:00 hora de Madrid (05:00 y 17:00 UTC en horario de verano)
    - cron: "0 5,17 * * *"
  workflow_dispatch: {}   # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer las noticias y regenerar la web
        run: python scripts/actualizar_noticias.py

      - name: Guardar los cambios (Netlify publica solo)
        run: |
          git config user.name "Trollacos Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias actualizadas"
            git push
          fi
