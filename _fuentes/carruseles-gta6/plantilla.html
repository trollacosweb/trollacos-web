<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Righteous';src:url(righteous.woff2)}
@font-face{font-family:'VT323';src:url(vt323.woff2)}
@font-face{font-family:'Rajdhani';src:url(rajdhani-700.woff2);font-weight:700}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#07021a}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;padding:54px 56px 0;color:#f6eeff;
 background:radial-gradient(ellipse 70% 40% at 82% 0%,rgba(255,43,214,.42),transparent 70%),radial-gradient(ellipse 60% 35% at 0% 100%,rgba(31,242,255,.18),transparent 70%),linear-gradient(180deg,#1a0838 0%,#0b0424 40%,#07021a 100%)}
.sol{position:absolute;right:-70px;top:-90px;width:380px;height:380px;border-radius:50%;background:linear-gradient(180deg,#ffd23f 0%,#ff8a3d 45%,#ff2bd6 100%);opacity:.9;
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px)}
.rej{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(rgba(31,242,255,.13) 2px,transparent 2px) 0 0/100% 46px,linear-gradient(90deg,rgba(31,242,255,.13) 2px,transparent 2px) 0 0/72px 100%;
 -webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000);transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
.k{position:relative;font:400 34px 'VT323';letter-spacing:3px;color:#1ff2ff}
h1{position:relative;font:400 72px/1 'Righteous';color:#ff2bd6;text-shadow:0 0 22px rgba(255,43,214,.55);margin-top:6px;max-width:700px}
.sub{position:relative;font:700 30px/1.2 'Rajdhani';color:#e9ddff;margin-top:14px;max-width:740px}
.cards{position:relative;display:flex;flex-direction:column;gap:20px;margin-top:34px}
.c{display:flex;gap:22px;align-items:center;background:rgba(20,9,74,.78);border:3px solid var(--col);border-left-width:12px;border-radius:20px;padding:20px 26px 20px 20px;box-shadow:0 0 18px color-mix(in srgb,var(--col) 35%,transparent)}
.ic{flex:none;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:rgba(7,2,26,.85);border:2px solid var(--col);color:#fff;font-family:'Noto Color Emoji','Righteous'}
.c b{display:block;font:700 37px/1.05 'Rajdhani';color:var(--col)}
.c p{font:700 28px/1.22 'Rajdhani';color:#f3ecff;margin-top:5px}
.y{--col:#ffd23f}.o{--col:#ff9a3d}.p{--col:#ff2bd6}.v{--col:#b98cff}.c2{--col:#1ff2ff}
.pie{position:absolute;left:56px;right:56px;bottom:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.tr{display:flex;align-items:flex-end;gap:14px}
.tr img{flex:none;width:96px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.bo{position:relative;max-width:560px;background:#fff;color:#1a0f3d;border-radius:16px;padding:12px 18px;font:400 30px/1.05 'VT323';box-shadow:4px 4px 0 #ff2bd6;margin-bottom:58px}
.bo:after{content:'';position:absolute;left:-12px;bottom:14px;border:10px solid transparent;border-right-color:#fff}
.marca{text-align:right}
.marca .w{font:400 46px 'Righteous';color:#ff2bd6;line-height:1}.marca .w span{color:#1ff2ff}
.marca .n{font:400 30px 'VT323';color:#ffd23f;letter-spacing:2px;margin-top:4px}
.fu{position:absolute;left:56px;right:56px;bottom:8px;font:700 17px 'Rajdhani';color:rgba(233,221,255,.55);text-align:center}
</style></head><body>
<div class="s" id="s"><div class="sol"></div><div class="rej"></div>
 <div class="k" id="k">&gt; GUÍA TROLLACOS DE GTA VI_</div>
 <h1 id="t"></h1><div class="sub" id="sub"></div>
 <div class="cards" id="cards"></div>
 <div class="pie"><div class="tr"><img src="trollaco.png" alt=""><div class="bo" id="bo"></div></div>
  <div class="marca"><div class="w">TROLLACOS<span>.COM</span></div><div class="n" id="n"></div></div></div>
 <div class="fu" id="fu"></div>
</div>
<script>
window.pinta=function(d){
 t.textContent=d.titulo;sub.textContent=d.sub;bo.textContent=d.troll;n.textContent=d.n;fu.textContent=d.fu||'';
 cards.innerHTML=d.cards.map(c=>`<div class="c ${c[3]=='c'?'c2':c[3]}"><div class="ic">${c[0]}</div><div><b>${c[1]}</b><p>${c[2]}</p></div></div>`).join('');
};
</script></body></html>
