<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Righteous';src:url(righteous.woff2)}@font-face{font-family:'VT323';src:url(vt323.woff2)}@font-face{font-family:'Rajdhani';src:url(rajdhani-700.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:540px;height:960px;overflow:hidden;background:transparent}
#esc{position:relative;width:540px;height:960px;font-family:'Rajdhani',sans-serif;font-weight:700;color:#fff}
#logo{position:absolute;top:30px;left:120px;width:300px}
#t{position:absolute;top:86px;left:0;right:0;text-align:center}
#t .a{font-family:'VT323';font-size:32px;color:#1ff2ff;text-shadow:0 0 10px #1ff2ff;letter-spacing:2px}
#t .b{font-family:'Righteous';font-size:46px;line-height:1.02;color:#ffd23f;text-shadow:3px 3px 0 #ff2bd6,0 0 22px #ff2bd6;margin-top:4px}
#t .c{font-size:26px;margin-top:6px;text-shadow:0 0 10px #ff2bd6}
#marco{position:absolute;left:16px;top:280px;width:508px;height:375px;border:4px solid #1ff2ff;border-radius:10px;box-shadow:0 0 22px #1ff2ff,0 0 0 7px rgba(255,43,214,.35)}
#rec{position:absolute;left:30px;top:292px;font-family:'VT323';font-size:20px;background:rgba(7,2,26,.7);padding:0 8px;border-radius:4px}
#rec i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b3b;margin-right:6px}
#agua{position:absolute;right:30px;top:618px;font-family:'VT323';font-size:22px;color:rgba(255,255,255,.8);text-shadow:0 0 6px #000,0 0 2px #000;letter-spacing:1px}
#troll{position:absolute;left:30px;top:690px;width:118px;image-rendering:pixelated;transform-origin:50% 100%}
.bo{position:absolute;left:170px;top:700px;max-width:330px;background:#fff;color:#07021a;font-size:28px;padding:10px 18px;border-radius:18px;border:4px solid #07021a;box-shadow:5px 5px 0 #ff2bd6;line-height:1.1}
.bo::before{content:'';position:absolute;left:-18px;top:28px;border:10px solid transparent;border-right:14px solid #07021a}
#cta{position:absolute;left:0;right:0;top:902px;text-align:center;font-family:'VT323';font-size:30px;color:#1ff2ff;text-shadow:0 0 10px #1ff2ff}
#cta b{color:#ffd23f;font-weight:400}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
canvas{position:absolute;inset:0}
</style></head><body><div id="esc">
<img id="logo" src="logo.webp">
<div id="t"><div class="a" id="ta"></div><div class="b" id="tb"></div><div class="c" id="tc"></div></div>
<div id="marco"></div><div id="rec"><i></i>EN DIRECTO</div><div id="agua">TROLLACOS.COM</div>
<img id="troll" src="trollaco-grande.png"><div class="bo" id="bo"></div>
<div id="cta">Toda la guía en <b>TROLLACOS.COM</b> 🎮</div>
<canvas id="cv" width="1080" height="1920" style="width:540px;height:960px"></canvas><div id="flash"></div>
</div><script>
const $=i=>document.getElementById(i),G=16.0;
const cv=$('cv'),cx=cv.getContext('2d');cx.scale(2,2);
const COL=['#ff2bd6','#1ff2ff','#ffd23f','#39ff88','#ffffff','#b06aff'];
let r=12345;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
const P=[];
function rafaga(t0,n,x0,y0,dir){for(let i=0;i<n;i++){const a=(-90+dir*(15+rnd()*40))*Math.PI/180,v=380+rnd()*420;P.push({t0,x0,y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:COL[i%6],w:5+rnd()*5,h:8+rnd()*8,rot:rnd()*6,vr:(rnd()-.5)*14,d:rnd()*.15})}}
rafaga(G,90,30,740,1);rafaga(G,90,510,740,-1);rafaga(G+.35,60,90,780,1);rafaga(G+.35,60,450,780,-1);rafaga(G+3.2,50,30,740,1);rafaga(G+3.2,50,510,740,-1);
const BA=['¿Cuánto queda? 👀','212 GB… mi disco llora 😭','Venga, venga… ¡VENGAAA!','Voy a por pipas… 🌻','¡Que no se vaya la luz!'];
const BB=['¡¡YA ESTÁÁÁ!! 🎉','¡100 % descargado!','Nos vemos en Leonida el 19 😎'];
window.pinta=function(t){
 const B=t>=G;
 $('ta').textContent=B?'✅ DESCARGA COMPLETA_':'🚨 PRECARGA DE GTA VI_';
 $('tb').innerHTML=B?'¡GTA VI YA ESTÁ<br>EN CASA!':'DESCARGANDO<br>GTA VI'+('.'.repeat(1+Math.floor(t*2)%3)).padEnd(3,' ');
 $('tc').textContent=B?'Jugable el 19 de noviembre de 2026':'212 GB de pura ansiedad';
 const pul=B?1+.06*Math.max(0,1-(t-G)*2)*Math.sin((t-G)*30):1;$('tb').style.transform=`scale(${pul})`;
 $('rec').style.opacity=(Math.floor(t*2)%2||B)?1:.35;
 // el Trollaco
 let ty=0,rot=0,sx=1;
 if(!B){ty=-Math.abs(Math.sin(t*5))*6;rot=Math.sin(t*2.5)*3}
 else{const u=t-G;ty=-Math.abs(Math.sin(u*7))*(u<6?60:22);rot=Math.sin(u*7)*8;sx=u<.25?1+u*.8:1}
 $('troll').style.transform=`translateY(${ty}px) rotate(${rot}deg) scale(${sx})`;
 const bo=$('bo');
 if(!B){bo.textContent=BA[Math.floor(t/3.2)%BA.length];bo.style.transform=`rotate(${Math.sin(t*2)*1.5}deg)`;bo.style.background='#fff'}
 else{const u=t-G;bo.textContent=u<4?BB[0]:u<8?BB[1]:BB[2];bo.style.transform=`scale(${u<.3?u/.3:1}) rotate(${Math.sin(u*6)*2}deg)`;bo.style.background=u<4?'#ffd23f':'#fff'}
 // flash y confeti
 $('flash').style.opacity=B?Math.max(0,.75-(t-G)*2.5):0;
 cx.clearRect(0,0,540,960);
 for(const p of P){const u=t-p.t0-p.d;if(u<0||u>5)continue;const x=p.x0+p.vx*u*.6+Math.sin(u*3+p.rot)*12,y=p.y0+p.vy*u+260*u*u;
  if(y>980)continue;cx.save();cx.globalAlpha=u>4?5-u:1;cx.translate(x,y);cx.rotate(p.rot+p.vr*u);cx.scale(1,Math.abs(Math.cos(u*6+p.rot))+.15);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
};
</script></body></html>
